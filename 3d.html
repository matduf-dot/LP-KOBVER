.head-inner{position:relative; z-index:2; max-width:760px; margin:0 auto}

<script>
/* La visionneuse est un document autonome qui tire three.js du CDN et porte ses
   textures en base64 : plusieurs Mo. loading="lazy" sur une iframe n'est qu'une
   indication, le navigateur la charge souvent tout de suite. On ne pose donc le
   src qu'a l'approche du viewport — sur cette page, autant dire des l'arrivee,
   mais le formulaire, lui, part en premier. Sans JS, le <noscript> prend le
   relais. */
(function(){
  var frames = document.querySelectorAll('iframe[data-src]');
  if(!frames.length) return;

  function build(f){
    if(f.hasAttribute('src')) return;
    f.src = f.getAttribute('data-src');
  }

  if(!('IntersectionObserver' in window)){
    Array.prototype.forEach.call(frames, build);
    return;
  }
  var io = new IntersectionObserver(function(entries, obs){
    entries.forEach(function(e){
      if(e.isIntersecting){ build(e.target); obs.unobserve(e.target); }
    });
  }, {rootMargin:'400px 0px'});
  Array.prototype.forEach.call(frames, function(f){ io.observe(f); });
})();
</script>

<script defer src="https://tally.so/widgets/embed.js"></script>
<script>
/* Sans ce script, la hauteur de l'iframe reste figee a 500px et le formulaire
   est coupe : c'est lui qui installe le src et qui ecoute les messages de
   redimensionnement (dynamicHeight=1). Si le fichier de Tally n'arrive pas
   — reseau 4G capricieux, blocage —, on pose le src a la main : le formulaire
   s'affiche quand meme, a hauteur fixe. */
document.addEventListener('DOMContentLoaded', function(){
  if(typeof Tally !== 'undefined'){ Tally.loadEmbeds(); return; }
  var l = document.querySelectorAll('iframe[data-tally-src]:not([src])');
  Array.prototype.forEach.call(l, function(f){
    f.src = f.getAttribute('data-tally-src');
  });
});
</script>
