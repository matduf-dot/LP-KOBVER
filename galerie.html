<style>
:root{
  --bg:#FCFAF8; --grid:#EFECE8; --grid-block:#F1EEEA;
  --ink:#161415; --ink-soft:#6B6663;
  --orange:#FF6341; --orange-dark:#E8482A;
  --nav-h:72px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg); color:var(--ink);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  -webkit-font-smoothing:antialiased; overflow-x:hidden}

/* NAV (identique a index.html) */
.nav{position:relative; z-index:20; height:var(--nav-h);
  display:flex; align-items:center; justify-content:space-between; gap:24px;
  padding:0 clamp(18px,3.4vw,56px); background:var(--bg); border-bottom:1px solid var(--grid)}
.brand{display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--ink)}
.brand-mark{width:28px; height:28px; flex:none; display:block; color:var(--orange)}
.brand span{font-weight:700; font-size:19px; letter-spacing:.14em}
.nav-links{display:flex; align-items:center; gap:clamp(16px,2.2vw,38px)}
.nav-links a{color:var(--ink); text-decoration:none; font-size:14.5px; font-weight:500; position:relative; padding:4px 0}
.nav-links a::after{content:''; position:absolute; left:0; bottom:0; height:1.5px; width:100%;
  background:var(--ink); transform:scaleX(0); transform-origin:right; transition:transform .35s cubic-bezier(.4,0,.2,1)}
.nav-links a:hover::after{transform:scaleX(1); transform-origin:left}
.btn{display:inline-flex; align-items:center; gap:9px; background:var(--orange); color:#fff;
  text-decoration:none; font-size:14.5px; font-weight:600; padding:11px 22px; border-radius:999px;
  box-shadow:0 0 0 4px rgba(255,99,65,.18);
  transition:background .25s, box-shadow .25s, transform .25s; white-space:nowrap}
.btn:hover{background:var(--orange-dark); box-shadow:0 0 0 7px rgba(255,99,65,.2); transform:translateY(-1px)}
.btn svg{width:16px; height:16px; transition:transform .3s}
.btn:hover svg{transform:translate(2px,-2px)}
.nav .btn{display:none}
@media(min-width:920px){ .nav .btn{display:inline-flex} }
@media(max-width:640px){ .nav-links{display:none} }

/* ---- bouton de langue ---- */
.nav-right{display:flex; align-items:center; gap:12px}
.lang-btn{display:inline-flex; align-items:center; cursor:pointer;
  background:var(--bg); color:var(--ink); border:1px solid var(--grid);
  border-radius:999px; padding:7px 13px 7px 10px;
  font:inherit; font-size:13.5px; font-weight:600; letter-spacing:.02em;
  transition:color .25s, border-color .25s, transform .25s}
.lang-btn:hover{color:var(--orange); border-color:var(--orange); transform:translateY(-1px)}
.lang-opt{display:inline-flex; align-items:center; gap:7px}
.lang-flag{width:20px; height:14px; flex:none; display:block; border-radius:2px;
  box-shadow:0 0 0 1px rgba(22,20,21,.14)}
/* on n'affiche que la langue vers laquelle on peut basculer */
html:not([lang="en"]) .lang-opt-fr{display:none}
html[lang="en"]      .lang-opt-en{display:none}
@media(max-width:400px){ .lang-btn{padding:7px 11px 7px 9px} }


.eyebrow{display:inline-flex; align-items:center; gap:9px; font-size:14.5px; font-weight:500;
  color:var(--ink); margin-bottom:14px}
.eyebrow .dot{width:15px; height:15px; border-radius:4px; background:var(--orange); flex:none}

/* FOOTER (identique a index.html) */
.foot{border-top:1px solid var(--grid); background:var(--bg); padding:26px 20px}
.foot-inner{max-width:1120px; margin:0 auto; display:grid;
  grid-template-columns:1fr auto 1fr; align-items:center; gap:18px}
.foot-brand{display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--ink);
  justify-self:start}
.foot-brand .brand-mark{width:26px; height:26px; color:var(--orange)}
.foot-brand span{font-weight:700; font-size:17px; letter-spacing:.14em}
.foot-social{justify-self:center; display:grid; place-items:center; width:40px; height:40px;
  border-radius:50%; color:var(--ink); border:1px solid var(--grid);
  transition:color .25s, border-color .25s, transform .25s}
.foot-social:hover{color:var(--orange); border-color:var(--orange); transform:translateY(-1px)}
.foot-social svg{width:20px; height:20px}
.foot-credit{justify-self:end; font-size:13.5px; color:var(--ink-soft);
  display:flex; flex-direction:column; align-items:flex-end; gap:3px; text-align:right}
.foot-credit a{color:var(--ink); text-decoration:none; font-weight:500}
.foot-credit a:hover{color:var(--orange)}
@media(max-width:600px){
  .foot-inner{grid-template-columns:1fr; justify-items:center; text-align:center; gap:14px}
  .foot-brand,.foot-credit{justify-self:center}
  .foot-credit{align-items:center; text-align:center}
}

:focus-visible{outline:2.5px solid var(--orange); outline-offset:3px; border-radius:4px}

/* ======================= GALERIE ======================= */
.gp{padding:clamp(44px,7vh,90px) clamp(18px,3.4vw,56px) clamp(56px,9vh,110px)}

.gp-top{max-width:1240px; margin:0 auto clamp(20px,3vh,32px)}
.gp-return{display:inline-flex; align-items:center; gap:8px; text-decoration:none;
  color:var(--ink); font-size:14.5px; font-weight:500;
  padding:9px 17px 9px 13px; border-radius:999px; border:1px solid var(--grid);
  background:var(--bg);
  transition:color .25s, border-color .25s, transform .25s}
.gp-return:hover{color:var(--orange); border-color:var(--orange); transform:translateX(-3px)}
.gp-return svg{width:17px; height:17px; flex:none}

.gp-head{max-width:1240px; margin:0 auto clamp(28px,4.4vh,48px); text-align:center}
.gp-head .eyebrow{justify-content:center}
.gp-title{font-size:clamp(1.7rem,3.4vw,2.9rem); line-height:1.2;
  letter-spacing:-.034em; font-weight:700}
.gp-count{margin-top:10px; font-size:14px; color:var(--ink-soft)}

.gp-grid{max-width:1240px; margin:0 auto; display:grid; gap:20px;
  grid-template-columns:repeat(4,minmax(0,1fr));
  align-items:start}          /* hauteur naturelle : aucun recadrage */
@media(max-width:1000px){ .gp-grid{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media(max-width:640px){  .gp-grid{grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px} }

.gp-item{display:block; width:100%; padding:0; border:0; background:none;
  cursor:zoom-in; font:inherit; color:inherit; text-align:left;
  border-radius:6px; overflow:hidden; position:relative;
  box-shadow:0 8px 20px rgba(22,20,21,.13);
  transition:transform .28s cubic-bezier(.22,.61,.36,1), box-shadow .28s}
.gp-item:hover{transform:translateY(-4px); box-shadow:0 16px 32px rgba(22,20,21,.2)}
.gp-item img{width:100%; height:auto; display:block; background:var(--grid-block)}
.gp-cap{position:absolute; left:0; right:0; bottom:0; padding:22px 10px 9px;
  font-size:12px; font-weight:500; color:#fff; text-align:center;
  background:linear-gradient(to top,rgba(0,0,0,.62),transparent);
  opacity:0; transition:opacity .28s}
.gp-item:hover .gp-cap,.gp-item:focus-visible .gp-cap{opacity:1}
@media(hover:none){ .gp-cap{opacity:1} }   /* au doigt, pas de survol : toujours visible */

.gp-back{display:flex; justify-content:center; margin-top:clamp(38px,6vh,64px)}

/* ======================= LIGHTBOX ======================= */
.lb{position:fixed; inset:0; z-index:100; display:none;
  background:rgba(17,15,16,.92); padding:16px}
.lb[open],.lb.is-open{display:grid; grid-template-rows:1fr auto; place-items:center}
.lb-stage{display:grid; place-items:center; width:100%; min-height:0}
/* les sources font ~300x460 : sans object-fit, l'image restait a sa taille
   native et max-height:88vh ne se declenchait jamais */
.lb-img{width:min(1100px,92vw); height:88vh; object-fit:contain;
  display:block; border-radius:4px; filter:drop-shadow(0 24px 60px rgba(0,0,0,.5))}
.lb-cap{margin-top:14px; color:#fff; font-size:15px; font-weight:500; text-align:center;
  padding:0 56px 4px}
.lb-btn{position:fixed; border:0; cursor:pointer; color:#fff;
  background:rgba(255,255,255,.12); backdrop-filter:blur(6px);
  display:grid; place-items:center; border-radius:50%;
  transition:background .22s, transform .22s}
.lb-btn:hover{background:var(--orange); transform:scale(1.06)}
.lb-btn svg{width:22px; height:22px}
.lb-close{top:calc(14px + env(safe-area-inset-top)); right:14px; width:46px; height:46px}
.lb-prev,.lb-next{top:50%; margin-top:-25px; width:50px; height:50px}
.lb-prev{left:14px}
.lb-next{right:14px}
.lb-btn[disabled]{opacity:.3; cursor:default}
.lb-btn[disabled]:hover{background:rgba(255,255,255,.12); transform:none}
body.lb-locked{overflow:hidden}

@media(max-width:640px){
  /* la rangee de boutons est en bas : on lui reserve sa hauteur
     pour que la legende ne passe pas dessous */
  .lb{padding:10px 10px calc(76px + env(safe-area-inset-bottom))}
  .lb-img{width:96vw; height:70vh}
  .lb-cap{font-size:13.5px; padding:0 12px 4px}
  /* au pouce : croix et fleches ramenees en bas, hors de la zone haute */
  .lb-close{top:auto; bottom:calc(14px + env(safe-area-inset-bottom)); right:14px; width:52px; height:52px}
  .lb-prev,.lb-next{top:auto; margin-top:0;
    bottom:calc(14px + env(safe-area-inset-bottom)); width:52px; height:52px}
  .lb-prev{left:14px}
  .lb-next{left:76px; right:auto}
}
@media (prefers-reduced-motion:reduce){ *{animation:none!important; transition:none!important} }
</style>
</head>

  var lbImg = document.getElementById('lbImg');
  var lbCap = document.getElementById('lbCap');
  var prev  = document.getElementById('lbPrev');
  var next  = document.getElementById('lbNext');
  var index = 0;
  var lastFocus = null;

  /* ---- construction de la grille ---- */
  COVERS.forEach(function(c, i){
    var b = document.createElement('button');
    b.className = 'gp-item';
    b.type = 'button';
    b.setAttribute('aria-label', 'Agrandir : ' + c.t);
    b.setAttribute('data-en-aria', 'Zoom in: ' + c.t);
    var img = document.createElement('img');
    img.src = c.d;
    img.alt = c.t;
    /* les premieres sont visibles d'emblee, le reste se charge en differe */
    img.loading = i < 8 ? 'eager' : 'lazy';
    img.decoding = 'async';
    var cap = document.createElement('span');
    cap.className = 'gp-cap';
    cap.textContent = c.t;
    b.appendChild(img);
    b.appendChild(cap);
    b.addEventListener('click', function(){ open(i); });
    grid.appendChild(b);
  });
  /* la grille vient d etre creee : on lui applique la langue courante */
  if (window.kobverApplyLang) window.kobverApplyLang();

  /* ---- lightbox ---- */
  function show(i){
    index = (i + COVERS.length) % COVERS.length;
    var c = COVERS[index];
    lbImg.src = c.d;
    lbImg.alt = c.t;
    lbCap.textContent = c.t + '  (' + (index + 1) + '/' + COVERS.length + ')';
  }
  function open(i){
    lastFocus = document.activeElement;
    show(i);
    lb.classList.add('is-open');
    document.body.classList.add('lb-locked');
    document.getElementById('lbClose').focus();
  }
  function close(){
    lb.classList.remove('is-open');
    document.body.classList.remove('lb-locked');
    lbImg.src = '';
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  document.getElementById('lbClose').addEventListener('click', close);
  prev.addEventListener('click', function(){ show(index - 1); });
  next.addEventListener('click', function(){ show(index + 1); });

  /* clic sur le fond : on ferme, mais pas si le clic vient de l'image ou d'un bouton */
  lb.addEventListener('click', function(e){
    if (e.target === lb || e.target.classList.contains('lb-stage')) close();
  });

  document.addEventListener('keydown', function(e){
    if (!lb.classList.contains('is-open')) return;
    if (e.key === 'Escape')     { e.preventDefault(); close(); }
    if (e.key === 'ArrowLeft')  { e.preventDefault(); show(index - 1); }
    if (e.key === 'ArrowRight') { e.preventDefault(); show(index + 1); }
  });
})();
</script>

<script>
/* Bascule FR/EN : le francais reste dans le HTML, l'anglais vit dans data-en.
   Le choix est memorise et partage entre index.html et galerie.html. */
(function(){
  var KEY = 'kobverLang';

  /* ne remplace que le premier noeud texte : les enfants (svg, pastilles) restent */
  function firstTextNode(el){
    for (var i = 0; i < el.childNodes.length; i++){
      var n = el.childNodes[i];
      if (n.nodeType === 3 && n.textContent.trim()) return n;
    }
    return null;
  }
  function readText(el){ var n = firstTextNode(el); return n ? n.textContent : el.textContent; }
  function writeText(el, txt){
    var n = firstTextNode(el);
    if (n) n.textContent = txt; else el.textContent = txt;
  }

  var ATTRS = [['data-en-alt','alt'], ['data-en-aria','aria-label'], ['data-en-title','title']];

  function apply(lang){
    document.documentElement.lang = lang;

    var els = document.querySelectorAll('[data-en]');
    for (var i = 0; i < els.length; i++){
      var el = els[i];
      if (!el.hasAttribute('data-fr')) el.setAttribute('data-fr', readText(el));
      writeText(el, lang === 'en' ? el.getAttribute('data-en') : el.getAttribute('data-fr'));
    }

    for (var a = 0; a < ATTRS.length; a++){
      var src = ATTRS[a][0], dest = ATTRS[a][1], keep = 'data-fr-' + dest;
      var list = document.querySelectorAll('[' + src + ']');
      for (var j = 0; j < list.length; j++){
        var e = list[j];
        if (!e.hasAttribute(keep)) e.setAttribute(keep, e.getAttribute(dest) || '');
        e.setAttribute(dest, lang === 'en' ? e.getAttribute(src) : e.getAttribute(keep));
      }
    }
  }

  function current(){
    try { return localStorage.getItem(KEY) === 'en' ? 'en' : 'fr'; } catch(e){ return 'fr'; }
  }

  /* les couvertures sont injectees par JS : on repasse apres leur construction */
  window.kobverApplyLang = function(){ apply(current()); };

  apply(current());

  var btn = document.getElementById('langBtn');
  if (btn) btn.addEventListener('click', function(){
    var next = current() === 'en' ? 'fr' : 'en';
    try { localStorage.setItem(KEY, next); } catch(e){}
    apply(next);
  });

  window.addEventListener('load', function(){ apply(current()); });
})();
</script>
